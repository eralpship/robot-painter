# NOTE: This file needs to be manually copy-pasted into Coolify deployment settings
# Changes to this file are NOT applied automatically
# Go to: Coolify → Your App → Configuration → Custom Nginx Configuration

server {
    # Cache HDR environment maps aggressively (1 year) - these rarely change
    location ~* \.hdr$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache WASM files for 1 week - third-party dependency that may update
    location ~* \.wasm$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Cache 3D model files for 1 day - these may change more frequently
    location ~* \.(glb|gltf|bin)$ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Handle server errors (50x)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
